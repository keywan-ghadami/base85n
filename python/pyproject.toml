[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "base85n"
version = "0.4.0"
description = "Base85N binary-to-text encoding: Python bindings for the Rust implementation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MPL-2.0" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.maturin]
module-name = "base85n"
# Builds an abi3 wheel that loads on every CPython from 3.9 up.
features = ["pyo3/extension-module"]
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
