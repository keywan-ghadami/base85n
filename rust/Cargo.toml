[package]
name = "base85n"
# Tracks the specification version it implements: the wire format is what a
# consumer of this crate depends on.
version = "0.5.0"
edition = "2021"
# 1.88 is where `slice::as_chunks` stabilised, which the decoder and block mode
# use to carry their bounds information into the compiler rather than re-check
# it per group; 1.87 does not build this crate.
rust-version = "1.88"
description = "Base85N: a compact encoding for data embedded in text formats (JSON, XML, HTML, config), with Dynamic Passthrough and Fill modes."
license = "MPL-2.0"
authors = ["Keywan Ghadami"]
repository = "https://github.com/keywan-ghadami/base85n"
homepage = "https://keywan-ghadami.github.io/base85n/"
documentation = "https://docs.rs/base85n"
readme = "README.md"
keywords = ["base85", "base64", "encoding", "binary-to-text", "json"]
categories = ["encoding", "text-processing"]
# LICENSE and testvectors/ are symbolic links to the single copies at the
# repository root; `cargo package` follows them, so the published tarball
# carries the licence text and the golden vectors as real files and
# `cargo test` works from it.
include = [
    "src/**/*.rs",
    "examples/*.rs",
    "include/base85n.h",
    "capi/run.sh",
    "capi/smoke.c",
    "testvectors/*.json",
    "README.md",
    "LICENSE",
]

[lib]
name = "base85n"
path = "src/lib.rs"
# rlib for Rust consumers; cdylib and staticlib for everyone else, through
# the C ABI in src/ffi.rs and the header in include/base85n.h.
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
# Off by default, and nightly-only: see the README's "A feature flag for more
# speed" section for what it needs and what it measures at. The crate is
# stable-only and portable without it.
simd = []

[dependencies]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
