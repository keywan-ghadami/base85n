[package]
name = "base85n"
# Tracks the specification version it implements: the wire format is what a
# consumer of this crate depends on, and nothing here is published anywhere
# that would give the number a second meaning.
version = "0.4.0"
edition = "2021"
description = "Base85N: a binary-to-text encoding scheme with Dynamic Passthrough and Solid Fill modes."
license = "MPL-2.0"

[lib]
name = "base85n"
path = "src/lib.rs"
# rlib for Rust consumers; cdylib and staticlib for everyone else, through
# the C ABI in src/ffi.rs and the header in include/base85n.h.
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
