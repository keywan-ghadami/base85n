# Publishing the Rust crate to crates.io.
#
# From CI rather than from a laptop, because that is the difference between a
# token that lives in one place with an audit trail and a token that lives in a
# shell history. The job holds `CRATES_IO_TOKEN` for the length of one step and
# nothing else in this repository can read it.
#
# Publishing is irreversible: a version can be yanked but never deleted, and the
# name is claimed for good. So every gate this project has runs *before* the
# upload, in this job, on the exact tree being published -- not "CI was green on
# main last week". The version has to be named twice, once in Cargo.toml and once
# by whoever starts the run, and the job refuses if they disagree.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to publish, exactly as it stands in rust/Cargo.toml (e.g. 0.5.0)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

# One publish at a time, and never cancelled halfway: an interrupted upload is
# the one state that is awkward to reason about.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      # Signing the provenance: `id-token` mints the OIDC token Sigstore binds
      # the signature to, `attestations` writes the result to this repository's
      # attestation store. Neither can write code or releases.
      id-token: write
      attestations: write
      contents: read
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy

      # The version is stated twice and has to agree. On a tag it is the tag; on
      # a manual run it is what the person typed. Either way it is compared with
      # the manifest, so a release cannot go out under a number nobody chose.
      - name: The version is the one that was asked for
        run: |
          manifest=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          case "${{ github.ref_type }}" in
            tag) asked="${GITHUB_REF_NAME#v}" ;;
            *)   asked="${{ inputs.version }}" ;;
          esac
          echo "manifest: $manifest, asked for: $asked"
          if [ "$manifest" != "$asked" ]; then
            echo "rust/Cargo.toml says $manifest, the release says $asked" >&2
            exit 1
          fi

      # Everything CI does, on this tree, before anything leaves the machine.
      - run: cargo build --verbose
      - run: cargo test --verbose
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: The C ABI, from C, against both headers
        run: ./capi/run.sh
      - name: Build with the declared minimum supported Rust version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          cargo +"$msrv" build --verbose

      - name: Package, and test the packaged crate on its own
        run: |
          cargo package --locked
          work=$(mktemp -d)
          tar xzf target/package/base85n-*.crate -C "$work"
          cd "$work"/base85n-*
          test -s LICENSE
          cargo test
          sh capi/run.sh

      - name: The checksum of what is about to be uploaded
        run: |
          sha256sum target/package/base85n-*.crate
          ls -l target/package/base85n-*.crate

      # crates.io stores a checksum and nothing else -- it has no signature
      # mechanism at all -- so this is the only signature this artifact can
      # have. The attestation is a Sigstore-signed statement that this
      # repository, this workflow and this commit produced exactly these bytes;
      # it is keyless, so there is no key here to guard or rotate, and it lands
      # in this repository's attestation store rather than in the registry.
      #
      # It works on the *published* file because `cargo publish` re-packages
      # deterministically: the checksum logged above is the one crates.io
      # records, so what a consumer downloads is byte-for-byte the subject
      # attested here, and
      #
      #   gh attestation verify base85n-<version>.crate --repo ${{ github.repository }}
      #
      # answers for the file cargo put in its cache.
      - name: Sign what is about to be uploaded
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: rust/target/package/base85n-*.crate

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --locked

      # The artifact travels to the release job, which is the only one allowed
      # to write to this repository.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crate
          path: rust/target/package/base85n-*.crate
          if-no-files-found: error

  # A tag on its own is a name with nothing attached to it. This turns it into
  # a place to look: the exact file that went to crates.io, its checksum, and
  # the command that checks the signature -- none of which crates.io itself can
  # hold. Only on a tag, because a release without one has nothing to hang on.
  github-release:
    name: GitHub Release
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      # Creating the release. Deliberately not on the publishing job: nothing
      # that holds the registry token can also write to this repository.
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crate
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum ./*.crate > SHA256SUMS
          cat SHA256SUMS
          cat > notes.md <<'EOF'
          The Rust crate, as published to
          [crates.io](https://crates.io/crates/base85n).

          The `.crate` file below is the one that was uploaded, byte for byte.
          Its build provenance is signed and can be checked against this
          repository:

          ```sh
          gh attestation verify base85n-*.crate --repo ${{ github.repository }}
          ```

          `SHA256SUMS` carries the same checksum the workflow logged before the
          upload and the one crates.io records.
          EOF
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --notes-file notes.md \
            --verify-tag \
            ./*.crate SHA256SUMS
