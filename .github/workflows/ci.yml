name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust ${{ matrix.toolchain }}
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal \
            --component clippy
          rustup default ${{ matrix.toolchain }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ matrix.toolchain }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.toolchain }}-
      - run: cargo build --verbose
      - run: cargo test --verbose
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: C ABI smoke test
        # Links the Rust staticlib into a C program, once against this
        # crate's header and once against the C implementation's, so a
        # drift in either direction fails here.
        run: ./capi/run.sh

  go:
    name: Go (${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24", "1.25"]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          # The module has no dependencies, so there is no go.sum to key a
          # cache on.
          cache: false
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -v ./...

  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - run: npm test

  c:
    name: C (${{ matrix.cc }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    defaults:
      run:
        working-directory: c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No apt install: the runner image carries gcc and clang with their
      # sanitizer runtimes. It used to install clang here, which cost ten
      # seconds on a good day and once sat in `apt-get update` for half an hour
      # on a bad one.
      #
      # The Makefile falls back to a plain build when the toolchain cannot do
      # sanitizers, which is right for a laptop and wrong here: it would turn a
      # missing runtime into a quietly weaker test rather than a failure. So
      # the output is checked. If this ever fails, the image changed and the
      # install belongs back.
      - name: make test, and it really was under the sanitizers
        run: |
          # pipefail, or the pipeline reports tee's status and a failing test
          # passes the step -- the same trap the Makefile's own recipe warns
          # about, one level up.
          set -o pipefail
          make test 2>&1 | tee "$RUNNER_TEMP/test.log"
          grep -q 'Building tests with -fsanitize' "$RUNNER_TEMP/test.log" || {
            echo "the suite fell back to a plain build: no sanitizer runtime for ${{ matrix.cc }}" >&2
            exit 1
          }
        env:
          CC: ${{ matrix.cc }}
      # Builds, tests, installs, and then consumes the install through both
      # find_package() and pkg-config -- plus the files clib copies, compiled
      # flattened the way clib leaves them. A library that builds but cannot be
      # packaged is what this catches; nothing in the suite is about that.
      - name: CMake, CTest, and the package a consumer gets
        working-directory: ${{ github.workspace }}
        run: ./tools/c-package-check.sh
        env:
          CC: ${{ matrix.cc }}

  fuzz:
    name: Fuzzing (short)
    runs-on: ubuntu-latest
    timeout-minutes: 21
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # libFuzzer needs its runtime archive, and unlike the sanitizers in the C
      # job this one is not reliably in the image -- which is why this step
      # existed at all. What it should not do is reach for apt before knowing
      # that: `apt-get update` is the step that hung for half an hour twice in
      # one morning, once here and once in the C job.
      #
      # So: ask the compiler where the archive is, and only if it is not there
      # go to apt -- install first, update only if that fails, each attempt
      # capped so a stalled mirror costs five minutes instead of the job.
      - name: The runtime libFuzzer needs
        run: |
          runtime=$(clang -print-file-name=libclang_rt.fuzzer-x86_64.a || true)
          if [ -f "$runtime" ]; then
            echo "already in the image: $runtime"
            exit 0
          fi
          echo "not in the image; asking apt for it"
          major=$(clang -dumpversion | cut -d. -f1)
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get install -y "libclang-rt-$major-dev"; then
              runtime=$(clang -print-file-name=libclang_rt.fuzzer-x86_64.a || true)
              test -f "$runtime" && { echo "installed: $runtime"; exit 0; }
            fi
            echo "attempt $attempt did not get it; refreshing the index"
            timeout 300 sudo apt-get update || true
            sleep $((attempt * 10))
          done
          echo "no libFuzzer runtime for clang $major" >&2
          exit 1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      # A CI run is not a fuzzing campaign: two minutes per target finds
      # regressions against the corpus and the seeds, not new bugs. It is here
      # so that a change which breaks a property breaks the build on the same
      # day, and so the harnesses cannot rot. Real campaigns are run by hand
      # with a large -max_total_time, or with no limit at all.
      - name: Encoder round trip and decoder robustness
        working-directory: c/fuzz
        run: make run SECS=120
      - name: C against Rust, in one process
        working-directory: c/fuzz
        run: make run-differential SECS=120
      # And once more against the crate's `simd` feature, which vectorises
      # three of the encoder's loops: the crate's own tests cover the kernels
      # against the scalar predicates they stand in for, this covers the whole
      # encoder against another implementation. Without +avx2 and -Z build-std,
      # which the feature wants for speed and not for what it emits.
      - name: Install Rust nightly for the simd build
        run: rustup toolchain install nightly --profile minimal
      - name: C against Rust with the simd feature
        working-directory: c/fuzz
        run: |
          make clean
          make run-differential SECS=120 CARGO="cargo +nightly" \
            RUST_FEATURES="--features simd"
      - name: Keep any crash for inspection
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes
          path: |
            c/fuzz/crash-*
            c/fuzz/timeout-*
            c/fuzz/leak-*
          if-no-files-found: ignore

  # The wheel is abi3: one build serves every interpreter from 3.9 up. It used
  # to be built six times, once per matrix leg, plus a seventh time for the
  # cross-implementation job -- seven Rust compiles of the same bytes. Built
  # once here, the legs below test the artefact a user actually installs
  # rather than a rebuild of it.
  python-wheel:
    name: Python wheel
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            python/target
          key: cargo-py-${{ hashFiles('python/Cargo.lock') }}
          restore-keys: cargo-py-
      - name: Build it
        working-directory: python
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --out dist
          ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-wheel
          path: python/dist/*.whl
          if-no-files-found: error

  python:
    name: Python bindings (${{ matrix.python }})
    needs: python-wheel
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-wheel
          path: python/dist
      # No Rust toolchain here any more, and no build: the wheel is the one
      # `python-wheel` produced, and this leg's job is to show that this
      # interpreter can load and use it.
      - run: |
          python -m pip install --upgrade pip
          python -m pip install pytest dist/*.whl
      - run: python -m pytest -v

  python-package:
    name: Python package is publishable
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # The same script the release workflow runs before it uploads anything,
      # and the same one a maintainer runs by hand: the versions agreeing, the
      # stubs reaching the wheel, a type checker finding them, and the source
      # distribution building and passing its own suite outside the repository.
      - run: ./tools/python-package-check.sh

  rust-simd:
    name: Rust simd feature (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Nightly is a moving target and this is the only part of the repository
      # that needs it. It is in the gate anyway: the feature is off by default,
      # but a build of it that stops compiling is a build nobody would notice
      # otherwise.
      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
      - run: cargo +nightly test --features simd --verbose
      # What the feature is for is only there when the standard library is
      # rebuilt for the target (see rust/README.md); this is the build the
      # measurements in that section were taken from, and it has to keep
      # compiling and agreeing with the golden vectors.
      - name: Test the build the feature is meant to be used in
        env:
          RUSTFLAGS: -C target-feature=+avx2
        run: |
          cargo +nightly test --features simd --verbose \
            -Z build-std=std,panic_abort --target x86_64-unknown-linux-gnu

  rust-package:
    name: Rust crate is publishable
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build the crate tarball
        working-directory: rust
        run: cargo package --locked
      # `include` in Cargo.toml is an allow-list, so a file added to the crate
      # later -- a second header, another example, a test fixture -- leaves the
      # tarball without anything failing. Nothing else notices: the suite that
      # runs from the unpacked crate only catches it if a test happens to need
      # the file. So the list is checked against what git tracks.
      - name: Every tracked file is in the tarball
        working-directory: rust
        run: |
          cargo package --list --locked | sort > /tmp/packaged
          # Two exceptions, both deliberate: .gitignore is git's own
          # bookkeeping, and fuzz/ is a separate crate of its own that a
          # consumer of this one has no use for. Everything else that is
          # tracked here belongs in the tarball.
          git ls-files . | grep -Ev '^(\.gitignore|fuzz/)' | sort > /tmp/tracked
          missing=$(comm -23 /tmp/tracked /tmp/packaged)
          if [ -n "$missing" ]; then
            echo "tracked but not packaged -- add it to the include list:" >&2
            echo "$missing" >&2
            exit 1
          fi
          echo "all $(wc -l < /tmp/tracked) tracked files are in the tarball"
      # What ships is what is tested: the tarball is unpacked outside the
      # repository and its own suite is run there, which is what proves the
      # licence and the shared vectors travelled with it -- both are symbolic
      # links here, and a consumer of the crate has neither.
      - name: Test the packaged crate on its own
        run: |
          work=$(mktemp -d)
          tar xzf rust/target/package/base85n-*.crate -C "$work"
          cd "$work"/base85n-*
          test -s LICENSE
          cargo test
          sh capi/run.sh
      - name: Build with the declared minimum supported Rust version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' rust/Cargo.toml)
          echo "rust-version = $msrv"
          rustup toolchain install "$msrv" --profile minimal
          cd rust && cargo +"$msrv" build --verbose

  cross-implementation:
    name: Cross-implementation vector check
    needs: python-wheel
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The generator and the checker import base85n; the wheel built once
      # above is what they import, so no Rust toolchain is needed here either.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-wheel
          path: dist
      - run: python -m pip install dist/*.whl
      - name: Verify shared test vectors are internally consistent
        run: python3 tools/check_vectors.py
      - name: Verify the vector generator reproduces them exactly
        run: |
          python3 tools/gen_vectors.py
          git diff --exit-code testvectors/

  # Aggregate gate: branch protection can require this single check instead of
  # every matrix leg.
  all-green:
    name: All tests passed
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [rust, rust-simd, rust-package, go, typescript, c, python-wheel, python, python-package, cross-implementation, fuzz]
    if: always()
    steps:
      - name: Fail if any job did not succeed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Job results: $RESULTS"
          case ",$RESULTS," in
            *,failure,*|*,cancelled,*|*,skipped,*)
              echo "One or more jobs did not succeed."
              exit 1
              ;;
          esac
          echo "All jobs succeeded."
