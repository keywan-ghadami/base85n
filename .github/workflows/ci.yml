name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust ${{ matrix.toolchain }}
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal \
            --component clippy
          rustup default ${{ matrix.toolchain }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ matrix.toolchain }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.toolchain }}-
      - run: cargo build --verbose
      - run: cargo test --verbose
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: C ABI smoke test
        # Links the Rust staticlib into a C program, once against this
        # crate's header and once against the C implementation's, so a
        # drift in either direction fails here.
        run: ./capi/run.sh

  go:
    name: Go (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24", "1.25"]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
          # The module has no dependencies, so there is no go.sum to key a
          # cache on.
          cache: false
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -v ./...

  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - run: npm test

  c:
    name: C (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    defaults:
      run:
        working-directory: c
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install clang sanitizer runtime
        if: matrix.cc == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: make test (with ASan/UBSan when supported)
        run: make test
        env:
          CC: ${{ matrix.cc }}
      - name: CMake + CTest
        run: |
          cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.cc }}
          cmake --build build
          ctest --test-dir build --output-on-failure

  fuzz:
    name: Fuzzing (short)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install clang and the sanitizer runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-rt-18-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      # A CI run is not a fuzzing campaign: two minutes per target finds
      # regressions against the corpus and the seeds, not new bugs. It is here
      # so that a change which breaks a property breaks the build on the same
      # day, and so the harnesses cannot rot. Real campaigns are run by hand
      # with a large -max_total_time, or with no limit at all.
      - name: Encoder round trip and decoder robustness
        working-directory: c/fuzz
        run: make run SECS=120
      - name: C against Rust, in one process
        working-directory: c/fuzz
        run: make run-differential SECS=120
      # And once more against the crate's `simd` feature, which vectorises
      # three of the encoder's loops: the crate's own tests cover the kernels
      # against the scalar predicates they stand in for, this covers the whole
      # encoder against another implementation. Without +avx2 and -Z build-std,
      # which the feature wants for speed and not for what it emits.
      - name: Install Rust nightly for the simd build
        run: rustup toolchain install nightly --profile minimal
      - name: C against Rust with the simd feature
        working-directory: c/fuzz
        run: |
          make clean
          make run-differential SECS=120 CARGO="cargo +nightly" \
            RUST_FEATURES="--features simd"
      - name: Keep any crash for inspection
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-crashes
          path: |
            c/fuzz/crash-*
            c/fuzz/timeout-*
            c/fuzz/leak-*
          if-no-files-found: ignore

  python:
    name: Python bindings (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            python/target
          key: cargo-py-${{ hashFiles('python/Cargo.lock') }}
          restore-keys: cargo-py-
      - run: python -m pip install --upgrade pip
      # maturin is the build backend, so pip fetches it from pyproject.toml
      # and the wheel it builds is the Rust implementation.
      - run: python -m pip install ".[test]"
      - run: python -m pytest -v

  python-package:
    name: Python package is publishable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # The same script the release workflow runs before it uploads anything,
      # and the same one a maintainer runs by hand: the versions agreeing, the
      # stubs reaching the wheel, a type checker finding them, and the source
      # distribution building and passing its own suite outside the repository.
      - run: ./tools/python-package-check.sh

  rust-simd:
    name: Rust simd feature (nightly)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Nightly is a moving target and this is the only part of the repository
      # that needs it. It is in the gate anyway: the feature is off by default,
      # but a build of it that stops compiling is a build nobody would notice
      # otherwise.
      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
      - run: cargo +nightly test --features simd --verbose
      # What the feature is for is only there when the standard library is
      # rebuilt for the target (see rust/README.md); this is the build the
      # measurements in that section were taken from, and it has to keep
      # compiling and agreeing with the golden vectors.
      - name: Test the build the feature is meant to be used in
        env:
          RUSTFLAGS: -C target-feature=+avx2
        run: |
          cargo +nightly test --features simd --verbose \
            -Z build-std=std,panic_abort --target x86_64-unknown-linux-gnu

  rust-package:
    name: Rust crate is publishable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build the crate tarball
        working-directory: rust
        run: cargo package --locked
      # `include` in Cargo.toml is an allow-list, so a file added to the crate
      # later -- a second header, another example, a test fixture -- leaves the
      # tarball without anything failing. Nothing else notices: the suite that
      # runs from the unpacked crate only catches it if a test happens to need
      # the file. So the list is checked against what git tracks.
      - name: Every tracked file is in the tarball
        working-directory: rust
        run: |
          cargo package --list --locked | sort > /tmp/packaged
          # Two exceptions, both deliberate: .gitignore is git's own
          # bookkeeping, and fuzz/ is a separate crate of its own that a
          # consumer of this one has no use for. Everything else that is
          # tracked here belongs in the tarball.
          git ls-files . | grep -Ev '^(\.gitignore|fuzz/)' | sort > /tmp/tracked
          missing=$(comm -23 /tmp/tracked /tmp/packaged)
          if [ -n "$missing" ]; then
            echo "tracked but not packaged -- add it to the include list:" >&2
            echo "$missing" >&2
            exit 1
          fi
          echo "all $(wc -l < /tmp/tracked) tracked files are in the tarball"
      # What ships is what is tested: the tarball is unpacked outside the
      # repository and its own suite is run there, which is what proves the
      # licence and the shared vectors travelled with it -- both are symbolic
      # links here, and a consumer of the crate has neither.
      - name: Test the packaged crate on its own
        run: |
          work=$(mktemp -d)
          tar xzf rust/target/package/base85n-*.crate -C "$work"
          cd "$work"/base85n-*
          test -s LICENSE
          cargo test
          sh capi/run.sh
      - name: Build with the declared minimum supported Rust version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' rust/Cargo.toml)
          echo "rust-version = $msrv"
          rustup toolchain install "$msrv" --profile minimal
          cd rust && cargo +"$msrv" build --verbose

  cross-implementation:
    name: Cross-implementation vector check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: python -m pip install ./python
      - name: Verify shared test vectors are internally consistent
        run: python3 tools/check_vectors.py
      - name: Verify the vector generator reproduces them exactly
        run: |
          python3 tools/gen_vectors.py
          git diff --exit-code testvectors/

  # Aggregate gate: branch protection can require this single check instead of
  # every matrix leg.
  all-green:
    name: All tests passed
    runs-on: ubuntu-latest
    needs: [rust, rust-simd, rust-package, go, typescript, c, python, python-package, cross-implementation, fuzz]
    if: always()
    steps:
      - name: Fail if any job did not succeed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Job results: $RESULTS"
          case ",$RESULTS," in
            *,failure,*|*,cancelled,*|*,skipped,*)
              echo "One or more jobs did not succeed."
              exit 1
              ;;
          esac
          echo "All jobs succeeded."
