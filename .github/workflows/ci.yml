name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust ${{ matrix.toolchain }}
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal \
            --component clippy
          rustup default ${{ matrix.toolchain }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ matrix.toolchain }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.toolchain }}-
      - run: cargo build --verbose
      - run: cargo test --verbose
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: C ABI smoke test
        # Links the Rust staticlib into a C program, once against this
        # crate's header and once against the C implementation's, so a
        # drift in either direction fails here.
        run: ./capi/run.sh

  go:
    name: Go (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24", "1.25"]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          # The module has no dependencies, so there is no go.sum to key a
          # cache on.
          cache: false
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -v ./...

  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - run: npm test

  c:
    name: C (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    defaults:
      run:
        working-directory: c
    steps:
      - uses: actions/checkout@v4
      - name: Install clang sanitizer runtime
        if: matrix.cc == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: make test (with ASan/UBSan when supported)
        run: make test
        env:
          CC: ${{ matrix.cc }}
      - name: CMake + CTest
        run: |
          cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.cc }}
          cmake --build build
          ctest --test-dir build --output-on-failure

  fuzz:
    name: Fuzzing (short)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang and the sanitizer runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-rt-18-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      # A CI run is not a fuzzing campaign: two minutes per target finds
      # regressions against the corpus and the seeds, not new bugs. It is here
      # so that a change which breaks a property breaks the build on the same
      # day, and so the harnesses cannot rot. Real campaigns are run by hand
      # with a large -max_total_time, or with no limit at all.
      - name: Encoder round trip and decoder robustness
        working-directory: c/fuzz
        run: make run SECS=120
      - name: C against Rust, in one process
        working-directory: c/fuzz
        run: make run-differential SECS=120
      - name: Keep any crash for inspection
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            c/fuzz/crash-*
            c/fuzz/timeout-*
            c/fuzz/leak-*
          if-no-files-found: ignore

  python:
    name: Python bindings (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            python/target
          key: cargo-py-${{ hashFiles('python/Cargo.lock') }}
          restore-keys: cargo-py-
      - run: python -m pip install --upgrade pip
      # maturin is the build backend, so pip fetches it from pyproject.toml
      # and the wheel it builds is the Rust implementation.
      - run: python -m pip install ".[test]"
      - run: python -m pytest -v

  rust-package:
    name: Rust crate is publishable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build the crate tarball
        working-directory: rust
        run: cargo package --locked
      # What ships is what is tested: the tarball is unpacked outside the
      # repository and its own suite is run there, which is what proves the
      # licence and the shared vectors travelled with it -- both are symbolic
      # links here, and a consumer of the crate has neither.
      - name: Test the packaged crate on its own
        run: |
          work=$(mktemp -d)
          tar xzf rust/target/package/base85n-*.crate -C "$work"
          cd "$work"/base85n-*
          test -s LICENSE
          cargo test
          sh capi/run.sh
      - name: Build with the declared minimum supported Rust version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' rust/Cargo.toml)
          echo "rust-version = $msrv"
          rustup toolchain install "$msrv" --profile minimal
          cd rust && cargo +"$msrv" build --verbose

  cross-implementation:
    name: Cross-implementation vector check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: python -m pip install ./python
      - name: Verify shared test vectors are internally consistent
        run: python3 tools/check_vectors.py
      - name: Verify the vector generator reproduces them exactly
        run: |
          python3 tools/gen_vectors.py
          git diff --exit-code testvectors/

  # Aggregate gate: branch protection can require this single check instead of
  # every matrix leg.
  all-green:
    name: All tests passed
    runs-on: ubuntu-latest
    needs: [rust, rust-package, go, typescript, c, python, cross-implementation, fuzz]
    if: always()
    steps:
      - name: Fail if any job did not succeed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Job results: $RESULTS"
          case ",$RESULTS," in
            *,failure,*|*,cancelled,*|*,skipped,*)
              echo "One or more jobs did not succeed."
              exit 1
              ;;
          esac
          echo "All jobs succeeded."
