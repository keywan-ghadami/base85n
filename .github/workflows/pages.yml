name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "spec/**"
      - "SECURITY.md"
      # The landing page is the repository README, so a change to it is a
      # change to the site.
      - "README.md"
      - "*/README.md"
      # bench/results/RESULTS.md is published as the Benchmarks page; without
      # this the site would keep serving an older report after a re-run.
      - "bench/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a queued run supersedes an older one but never
# cancels a deployment already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -r site/requirements.txt
      - name: Build site
        run: python site/build.py --output _site
      - name: Check that every internal link and anchor resolves
        run: python site/check_links.py _site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
