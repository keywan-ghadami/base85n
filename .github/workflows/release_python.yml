# Publishing the Python distribution to PyPI.
#
# Same reasoning as the crate's release workflow: from CI rather than from a
# laptop, every gate in front of the upload rather than behind it, and the
# version named twice so a release cannot go out under a number nobody chose.
# What is different here is what has to be built. A wheel is per-platform, and
# this one contains compiled Rust, so one machine cannot produce them all: the
# matrix below builds each, they are collected as artifacts, and only then does
# anything get uploaded -- a release that is half on the index is worse than one
# that never started.
#
# There is no API token. PyPI is told, once, that this repository and this
# workflow may publish this project, and each run proves it is that workflow
# with a short-lived OIDC token GitHub mints on the spot. After that there is
# no secret in this repository to leak, rotate or forget.
#
# The one-time setup, before the first release: on PyPI, under Your projects ->
# Publishing (or, for a project that does not exist yet, Account settings ->
# Publishing -> Add a pending publisher), fill the form with
#
#     PyPI project name   base85n
#     Owner               keywan-ghadami
#     Repository name     base85n
#     Workflow name       release_python.yml
#     Environment name    pypi
#
# All five have to match what this file does, the environment included -- it is
# the second half of the agreement, and an upload from any other environment is
# refused. Rehearsing on TestPyPI first means the same form at
# test.pypi.org with `testpypi` as the environment name, and then running this
# workflow with `index: testpypi`.
name: Release (Python)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to publish, exactly as it stands in python/pyproject.toml (e.g. 0.5.0)"
        required: true
        type: string
      index:
        description: "Where to publish it"
        required: true
        default: pypi
        type: choice
        options: [pypi, testpypi]
  push:
    # Deliberately not `v*`: that tag releases the crate, and the two are not
    # obliged to go out together.
    tags:
      - "python-v*"

permissions:
  contents: read

concurrency:
  group: release-python
  cancel-in-progress: false

jobs:
  # Everything that can be decided from one machine, decided before any of the
  # build matrix starts.
  gate:
    name: Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # The script checks that the three manifests agree with each other; the
      # argument makes them agree with the release as well. On a tag that is
      # the tag, on a manual run it is what the person typed.
      - name: Every gate the package has, against the version being released
        run: |
          case "${{ github.ref_type }}" in
            tag) asked="${GITHUB_REF_NAME#python-v}" ;;
            *)   asked="${{ inputs.version }}" ;;
          esac
          echo "releasing $asked"
          ./tools/python-package-check.sh "$asked"

  wheels:
    name: Wheel (${{ matrix.platform }} ${{ matrix.target }})
    needs: gate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `runnable` marks the legs whose wheel the runner can actually
          # load: the same architecture, and a C library it has. The others
          # are cross-compiled, or musl wheels on a glibc runner, and are
          # covered on their own architecture by the `python` job in CI.
          - { platform: linux, runner: ubuntu-latest, target: x86_64, manylinux: auto, runnable: true }
          - { platform: linux, runner: ubuntu-latest, target: aarch64, manylinux: auto }
          - { platform: musl, runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { platform: musl, runner: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          # Intel macOS is cross-compiled from the arm64 runner rather than
          # built on an Intel one. `macos-13` was the Intel image, and it is
          # gone: in the first real run of this workflow every other leg had a
          # runner within seconds and that one waited with none assigned until
          # it was cancelled. Rust carries both apple-darwin targets, so the
          # wheel is the same; what is lost is running it here, since an arm64
          # interpreter cannot load an x86-64 extension.
          - { platform: macos, runner: macos-14, target: x86_64 }
          - { platform: macos, runner: macos-14, target: aarch64, runnable: true }
          - { platform: windows, runner: windows-latest, target: x64, runnable: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # One wheel per platform rather than one per interpreter: the extension
      # is built against the stable ABI (abi3, CPython 3.9 and up), which is
      # what `requires-python = ">=3.9"` is allowed to promise on the strength
      # of. The Linux legs build inside the manylinux images so the wheels run
      # on distributions older than the runner.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          sccache: "true"
      - name: The wheel imports and round-trips
        if: matrix.runnable
        working-directory: python
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -c "
          import base85n, pathlib
          package = pathlib.Path(base85n.__file__).parent
          assert (package / 'py.typed').is_file(), 'the wheel lost its typing marker'
          assert (package / '__init__.pyi').is_file(), 'the wheel lost its stubs'
          assert base85n.decode(base85n.encode(b'hello')) == b'hello'
          print('ok', base85n.__version__, 'on', package)
          "
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.platform }}-${{ matrix.target }}
          path: python/dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The sdist is what pip falls back to where no wheel matches, so it is
      # not decoration: `gate` has already built one and run the suite from
      # inside it.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: python/dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to ${{ github.event_name == 'workflow_dispatch' && inputs.index || 'pypi' }}
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    # The environment is the second half of the trusted-publishing agreement:
    # PyPI is configured to accept uploads from this workflow *in this
    # environment*, so a run that is not this one cannot mint a usable token.
    # It is also where a required reviewer would go, if this project ever wants
    # a human between a green build and an upload.
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.index || 'pypi' }}
    permissions:
      # Mint the OIDC token PyPI checks, and the one Sigstore binds the build
      # provenance to. Neither of these can write code or releases.
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      # Recorded in the job log so the artifacts can be identified afterwards,
      # and so that a wheel missing from the matrix is visible here rather than
      # on the index.
      - name: What is about to be uploaded
        run: |
          ls -l dist
          sha256sum dist/*
          # One per leg of the wheel matrix above, plus the sdist. The number
          # is written out so that a leg that silently stopped producing a
          # wheel is caught here and not by a user on that platform.
          wheels=$(ls dist/*.whl | wc -l)
          test "$wheels" -eq 7 || { echo "expected 7 wheels, found $wheels" >&2; exit 1; }
          ls dist/*.tar.gz >/dev/null
      # Two signatures over the same bytes, answering to two audiences. This
      # one lands in the repository's attestation store, so `gh attestation
      # verify` works on a file somebody already has, whatever they got it
      # from; the PEP 740 one below travels with the file to PyPI, where the
      # index itself checks and displays it. Neither uses a key that exists
      # for longer than this job.
      - name: Sign what is about to be uploaded
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      # No password: the action exchanges the job's OIDC token for an upload
      # token, and signs each file into a PEP 740 attestation on the way, which
      # is a provenance record anybody can check against this repository.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          repository-url: ${{ (github.event_name == 'workflow_dispatch' && inputs.index == 'testpypi') && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          print-hash: true
          # So that a re-run after a failure further down does not stop here.
          # It is not a way to overwrite anything: PyPI refuses a file that
          # differs from one it already has, whatever this says.
          skip-existing: true

  # A tag on its own is a name with nothing attached to it. This turns it into
  # a place to look: every wheel and the sdist that went to the index, their
  # checksums, and the commands that check both signatures.
  #
  # It also *makes* the tag when the run was started by hand -- `gh release
  # create` creates one at the commit being released -- so a release leaves a
  # tag behind whichever way it was started. The name comes from the version
  # the gate already checked against all three manifests.
  #
  # Not for a TestPyPI rehearsal: that is a dry run, and a dry run should not
  # leave a tag and a release on the repository behind it.
  github-release:
    name: GitHub Release
    needs: publish
    if: github.event_name != 'workflow_dispatch' || inputs.index == 'pypi'
    runs-on: ubuntu-latest
    permissions:
      # Creating the release, and nothing else. Deliberately not on the
      # publishing job: what can upload to an index does not also get to write
      # to this repository.
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('python-v{0}', inputs.version) }}
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS
          cat > notes.md <<'EOF'
          The Python distribution, as published to
          [PyPI](https://pypi.org/project/base85n/): one `abi3` wheel per
          platform and the source distribution.

          These are the files that were uploaded, byte for byte. Both
          signatures over them are keyless and bound to this repository, this
          workflow and this commit:

          ```sh
          # the build provenance, on a file you already have
          gh attestation verify base85n-*.whl --repo ${{ github.repository }}

          # the PEP 740 attestation, as PyPI serves it
          pypi-attestations verify pypi base85n-*.whl \
            --repository https://github.com/${{ github.repository }}
          ```

          `SHA256SUMS` carries the checksums the workflow logged before the
          upload.
          EOF
          # Create-or-update rather than create. A release run can die after
          # the upload -- a network blip in the step below, a cancelled job --
          # and what is left then is a published version that cannot be
          # released again, because `gh release create` refuses a tag that
          # already has one. It also covers the release somebody made by hand
          # before realising the workflow does it.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "release $TAG exists; replacing its files and notes"
            gh release upload "$TAG" --repo "$REPO" --clobber ./*.whl ./*.tar.gz SHA256SUMS
            gh release edit "$TAG" --repo "$REPO" --notes-file notes.md
          else
            gh release create "$TAG" \
              --repo "$REPO" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file notes.md \
              ./*.whl ./*.tar.gz SHA256SUMS
          fi
