# Dependency updates. Both ecosystems are here for the same reason: the
# workflows pin every action to a commit SHA, which is what keeps a moving tag
# from moving under us -- and a pin nobody updates is a pin that rots. This is
# what updates it, keeping the `# v4` comment beside the SHA current.
#
# The library itself has no runtime dependencies in any language; what is left
# is the test and build side, which is still a supply chain.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "rust"

  - package-ecosystem: cargo
    directory: /python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "python"

  - package-ecosystem: npm
    directory: /typescript
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "typescript"

  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "go"
