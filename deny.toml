# cargo-deny: the supply chain of a library that has no runtime dependencies.
#
# That is worth saying plainly, because it decides what this file is for. No
# implementation in this repository links a third-party crate, module or package
# at runtime -- the Rust crate's `[dependencies]` section is empty. What is left
# is the *build and test* side: serde and serde_json to read the shared vectors,
# rand to generate property-test inputs. A compromise there does not reach a
# consumer of the crate, but it does reach anyone who builds it from source and
# runs its tests, which is what this repository asks its users to do.

[graph]
# Dev-dependencies are the whole point here -- the library has no runtime
# dependencies at all, so a graph without the test and build side would be one
# crate checked against itself. They are in the graph by default for advisories,
# bans and sources; the licence check needs `include-dev` below, which is the
# one place cargo-deny leaves them out.
exclude-dev = false

[advisories]
# RUSTSEC advisories are an error, including for build and dev dependencies.
# There is no allow-list: an advisory here is a thing to fix or to argue about
# in a commit message, not to wave through in a config file.
version = 2
yanked = "deny"

[licenses]
version = 2
# Dev-dependencies too. cargo-deny leaves them out by default, on the reasoning
# that what you do not ship you do not have to license -- but the point here is
# the tree a contributor builds and runs, not only the one a consumer links, and
# this repository has no second tree to check.
include-dev = true
# The project is MPL-2.0. These are the licences its dev-dependencies carry, and
# the set is deliberately small: anything else needs a decision, not a default.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
# Two versions of the same crate in one tree is how a supply chain grows without
# anyone deciding to grow it.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Nothing may come from anywhere but crates.io -- no git dependencies, no
# alternative registries, no vendored path outside this repository.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
